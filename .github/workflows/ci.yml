name: CI
run-name: CI ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup takes the version from packageManager in the root package.json.
      # Naming a version here as well fails the step.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@drizztdourden08'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint and typecheck
        run: pnpm run lint

      - name: Markdown
        run: pnpm run lint:md

      - name: Structure
        run: pnpm run structure

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm --filter ./apps/web build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
