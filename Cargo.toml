[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
authors = ["drizztdourden_ <drizztdourden08@users.noreply.github.com>"]
repository = "https://github.com/drizztdourden08/argus"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Line tables are enough for a backtrace; full debug info filled the target folder with pdb files.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0
