[package]
name = "argus-coord"
description = "Argus coord: the coord CLI (verbs and hooks) in Rust, behind the `coord` shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argus-agents = { path = "../argus-agents" }
argus-board = { path = "../argus-board" }
argus-core = { path = "../argus-core" }
argus-launchers = { path = "../argus-launchers" }
argus-native = { path = "../argus-native" }
argus-notify = { path = "../argus-notify" }
argus-wake = { path = "../argus-wake" }
argus-worktrees = { path = "../argus-worktrees" }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
ureq = { version = "3", default-features = false }

[dev-dependencies]
argus-native = { path = "../argus-native" }
argus-procs = { path = "../argus-procs" }
argus-server = { path = "../argus-server" }
argus-testkit = { path = "../argus-testkit" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
