[package]
name = "argus-wake"
description = "Argus wake crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argus-board = { path = "../argus-board" }
argus-core = { path = "../argus-core" }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
time = { version = "0.3.45", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
argus-core = { path = "../argus-core", features = ["testkit"] }
