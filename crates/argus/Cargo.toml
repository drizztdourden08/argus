[package]
name = "argus"
description = "Argus: the coordination dashboard of every project on this machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argus-core = { path = "../argus-core" }
argus-native = { path = "../argus-native" }
argus-parity = { path = "../argus-parity" }
argus-server = { path = "../argus-server" }
argus-wake = { path = "../argus-wake" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
argus-testkit = { path = "../argus-testkit" }
tempfile = "3"

[lints]
workspace = true
