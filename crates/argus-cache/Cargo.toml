[package]
name = "argus-cache"
description = "Argus build cache crate: reads Brock's per-user build cache, works out who uses each entry and prunes the unused."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argus-core = { path = "../argus-core" }
argus-worktrees = { path = "../argus-worktrees" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
argus-core = { path = "../argus-core", features = ["testkit"] }
filetime = "0.2"
tempfile = "3"

[lints]
workspace = true
