[package]
name = "argus-records"
description = "Argus local remote records: the release store and its update feed, the check runs and the local package registry, all read from the files Brock and the Overlord write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
argus-core = { path = "../argus-core" }
notify = "8"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
argus-core = { path = "../argus-core", features = ["testkit"] }
tempfile = "3"

[lints]
workspace = true
